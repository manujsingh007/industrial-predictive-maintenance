[project]
name = "predmaint"
version = "0.1.0"
description = "Remaining useful life estimation, failure prediction and anomaly detection for turbofan engines"
readme = "README.md"
authors = [
    { name = "Manuj Singh Sansanwal", email = "manujsansanwal2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dashboard = [
    "httpx>=0.28.1",
    "streamlit>=1.67.0",
]
deep = [
    "torch>=2.15.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a running PostgreSQL; they are excluded unless asked for with
#   uv run pytest -m integration
addopts = "-ra -m 'not integration'"
markers = ["integration: needs PostgreSQL at DATABASE_URL (docker compose up -d)"]

# PyTorch: on Linux (CI) use the CPU-only build instead of the much larger CUDA build from
# PyPI; macOS uses PyPI's build, which supports Apple MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
