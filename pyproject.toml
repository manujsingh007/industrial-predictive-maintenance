[project]
name = "predmaint"
version = "0.1.0"
description = "Remaining useful life estimation, failure prediction and anomaly detection for turbofan engines"
readme = "README.md"
authors = [
    { name = "Manuj Singh Sansanwal", email = "manujsansanwal2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
