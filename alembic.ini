# Alembic configuration. Run from the project root:
#   uv run alembic upgrade head        apply all migrations
#   uv run alembic current             show the applied revision
# The database URL is NOT stored here: env.py reads DATABASE_URL (environment or .env).

[alembic]
script_location = %(here)s/src/predmaint/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
