# Full stack in one command:   docker compose up --build
# Demo data (replay engines):   docker compose --profile demo up replay
# Stop:                         docker compose down       (volumes, i.e. all data, are kept)
# Reset EVERYTHING:             docker compose down -v    (deletes the database AND the model)
#
# Credentials come from .env (copy .env.example). The first start downloads the dataset and
# trains the model (a few minutes); later starts reuse them from the "state" volume.
#
# Order: postgres (healthy) -> migrate + model (complete) -> api (healthy) -> dashboard / replay

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
  image: predmaint-app:latest
  environment:
    # Inside the Compose network the database host is the service name, not localhost.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  volumes:
    - state:/state # data + MLflow store; same path in every container (MLflow stores paths)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes $ for Compose, so the variables are expanded inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate: # one-shot: create/upgrade the tables
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  model: # one-shot: download data + build the champion model (skipped if it already exists)
    <<: *app
    command: ["python", "-m", "predmaint.training.bootstrap", "--subset", "FD001"]
    restart: "no"

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      model:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl; /health answers 200 only when the model is loaded.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dashboard
    image: predmaint-dashboard:latest
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  replay: # demo only: docker compose --profile demo up replay
    <<: *app
    profiles: ["demo"]
    command:
      - python
      - -m
      - predmaint.simulation.replay
      - --subset=FD001
      - --units=1-100
      - --predict-every=10
      - --batch-size=10
      - --base-url=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  state:
