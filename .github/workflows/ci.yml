name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL for the integration tests. These credentials exist only inside
    # this CI job, so they are not secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: predmaint
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: predmaint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predmaint -d predmaint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://predmaint:ci-only-password@localhost:5432/predmaint

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # "deep" adds PyTorch for the CNN tests; "dashboard" adds Streamlit for the app tests.
      # On Linux, uv.lock pins the CPU-only PyTorch build (see [tool.uv.sources] in
      # pyproject.toml), so no CUDA libraries are downloaded.
      - name: Install dependencies
        run: uv sync --locked --group deep --group dashboard

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      # Applies the real migrations with the same command used locally.
      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run integration tests (PostgreSQL)
        run: uv run pytest -m integration

      # Separate process: PyTorch and LightGBM must not be loaded together (tests_deep/README.md).
      - name: Run deep-learning tests
        run: uv run --group deep pytest tests_deep

  # Builds both Docker images (no push) so a broken Dockerfile or lockfile fails CI.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image (target app)
        run: docker build --file docker/Dockerfile --target app --tag predmaint-app:ci .

      - name: Build dashboard image (target dashboard)
        run: docker build --file docker/Dockerfile --target dashboard --tag predmaint-dashboard:ci .

      - name: Smoke-test the images
        run: |
          docker run --rm predmaint-app:ci python -c "import lightgbm, predmaint.serving.api"
          docker run --rm predmaint-dashboard:ci python -c "import streamlit, predmaint.dashboard.logic"
